<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 480" width="200" height="480" role="img" aria-label="KCC serum bottle">
  <!-- Placeholder for the travelling product. Replace this file (or set the
       hero CMS field "productImage") with the real transparent PNG/WebP. -->
  <defs>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6b3a2c"/>
      <stop offset="0.18" stop-color="#a8654c"/>
      <stop offset="0.42" stop-color="#d8a28a"/>
      <stop offset="0.6" stop-color="#b9785e"/>
      <stop offset="1" stop-color="#5a2f24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7a5a2a"/>
      <stop offset="0.35" stop-color="#e6c787"/>
      <stop offset="0.55" stop-color="#f6e2b0"/>
      <stop offset="1" stop-color="#8a6630"/>
    </linearGradient>
    <linearGradient id="bulb" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2b1d18"/>
      <stop offset="0.45" stop-color="#5b4038"/>
      <stop offset="1" stop-color="#1c1310"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- dropper bulb -->
  <path d="M78 18c0-10 9-16 22-16s22 6 22 16v62H78z" fill="url(#bulb)"/>
  <!-- collar -->
  <rect x="66" y="78" width="68" height="48" rx="6" fill="url(#gold)"/>
  <rect x="66" y="92" width="68" height="3" fill="#000" opacity="0.12"/>
  <rect x="66" y="108" width="68" height="3" fill="#000" opacity="0.12"/>
  <!-- neck -->
  <rect x="80" y="124" width="40" height="22" fill="url(#glass)"/>
  <!-- body -->
  <path d="M80 144c-34 10-52 30-52 62v222c0 26 16 42 42 42h60c26 0 42-16 42-42V206c0-32-18-52-52-62z" fill="url(#glass)"/>
  <!-- inner liquid line -->
  <path d="M34 232h132v196c0 22-12 34-34 34H68c-22 0-34-12-34-34z" fill="#3e1f17" opacity="0.18"/>
  <!-- label -->
  <rect x="46" y="268" width="108" height="120" rx="6" fill="#f7efe6" opacity="0.94"/>
  <text x="100" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="3" fill="#2d6a4f">KCC</text>
  <rect x="78" y="330" width="44" height="1.5" fill="#c9a84c"/>
  <text x="100" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.5" fill="#6b5a4c">RADIANCE SERUM</text>
  <text x="100" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1.5" fill="#9a8a7c">30 ML · 1 FL OZ</text>
  <!-- highlights -->
  <path d="M46 214c0-18 8-32 22-40v250c-12-4-22-14-22-30z" fill="url(#shine)" opacity="0.7"/>
  <rect x="140" y="220" width="6" height="190" rx="3" fill="#fff" opacity="0.18"/>
  <rect x="90" y="8" width="5" height="60" rx="2.5" fill="#fff" opacity="0.18"/>
</svg>
